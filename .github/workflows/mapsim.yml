name: Mapsim Tests
run-name: Testing mapsim in a push by ${{ github.actor }}

on:
  push:
    paths:
      - "scripts/mapsim/**"
      - "scripts/mapview/**"
      - "scripts/gameio/**"
      - "sandbox/census/census.py"
      - ".github/workflows/mapsim.yml"
      - "conftest.py"
      - "pytest.ini"

jobs:
  pytest:
    name: Mapsim Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install pytest
        run: |
          pip install pytest pillow
      - name: Run Tests
        run: |
          python -m pytest scripts/mapsim/tests scripts/mapview/tests scripts/gameio/tests -q -m "not local"

name: GR2 Native Route Tests

on:
  push:
    paths:
      - "scripts/havok/**"
      - ".github/workflows/gr2-native-tests.yml"
  pull_request:
    paths:
      - "scripts/havok/**"
      - ".github/workflows/gr2-native-tests.yml"

permissions:
  contents: read

jobs:
  native-route-controls:
    name: Native GR2 route host controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install host test dependencies
        run: python -m pip install numpy pytest
      - name: Run process stand-ins without game files or native launches
        run: python -m pytest scripts/havok/tests/test_gr2_lint_native.py -q

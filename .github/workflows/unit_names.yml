name: Unit Name Validation
run-name: Validating unit names in a push by ${{ github.actor }}

# Every unit name in the per-map .mods.xml files and every cUnitTypezp... constant in the AI must exist exactly
# (spelling and case). 2026-10-05: 'zpDryDock' in zpistanbulb.mods.xml killed every AI on Istanbul.
# No game install here: vanilla names are checked against scripts/source/protoy.xml (case mismatches still fail).

on: push

jobs:
  unit-names:
    name: Exact unit names (per-map mods files, AI constants)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Check unit names
        run: |
          python scripts/tools/check_unit_names.py --no-live
